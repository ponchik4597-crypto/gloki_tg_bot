[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gloki_bot"
version = "0.1.0"
requires-python = ">=3.12"
description = "Асинхронный Telegram-бот на aiogram"
readme = "README.md"
authors = [
    { name = "Олеся Викторина", email = "olesia_viktorina@mail.ru" }
]
dependencies = [
    "aiofiles==25.1.0",
    "aiogram==3.27.0",
    "aiohappyeyeballs==2.6.1",
    "aiohttp==3.13.5",
    "aiosignal==1.4.0",
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "attrs==26.1.0",
    "certifi==2026.4.22",
    "frozenlist==1.8.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.13",
    "magic-filter==1.0.12",
    "multidict==6.7.1",
    "propcache==0.4.1",
    "psycopg2-binary==2.9.12",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "python-dotenv==1.2.2",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "yarl==1.23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
